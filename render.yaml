# Render Blueprint — Smart Study Planner
#
# 1-xizmat: statik demo sahifa (baza talab qilmaydi, darhol ishlaydi).
# 2-xizmat: to'liq ilova (Express API + React frontend). U MongoDB Atlas
#           ulanish satrini talab qiladi, shuning uchun hozircha o'chirilgan.
#           Yoqish uchun quyidagi blokning izohini (#) olib tashlang va
#           Render boshqaruv panelida MONGODB_URI hamda JWT_SECRET ni kiriting.

services:
  - type: web
    name: smart-study-planner-demo
    runtime: static
    buildCommand: echo "Statik demo - build talab qilinmaydi"
    staticPublishPath: ./demo
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

